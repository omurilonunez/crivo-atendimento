# Monta a imagem Docker da plataforma da Crivo e publica no GitHub (ghcr.io).
# Roda a cada push na branch crivo. O servidor (EasyPanel) só baixa a imagem pronta.
name: Imagem da plataforma

on:
  push:
    branches: [crivo]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gerar ícones da Crivo
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq librsvg2-bin imagemagick
          bash crivo/gerar-icones.sh

      # Só o código MIT (Community). A pasta enterprise/ tem licença paga e fica fora da imagem.
      - name: Tirar o código enterprise
        run: |
          rm -rf enterprise spec/enterprise
          echo -en '\nENV CW_EDITION="ce"' >> docker/Dockerfile

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e publicação
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/omurilonunez/crivo-atendimento:latest
            ghcr.io/omurilonunez/crivo-atendimento:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
